databaseChangeLog:
  - changeSet:
      id: 003_create_transactions_table
      author: bankapp
      changes:
        - createTable:
            tableName: transactions
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: account_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_transactions_accounts
                    references: accounts(id)
              - column:
                  name: type
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: amount
                  type: NUMERIC(15,2)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
                  defaultValue: "COMPLETED"
              - column:
                  name: description
                  type: VARCHAR(500)
              - column:
                  name: reference_number
                  type: VARCHAR(50)
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
                  defaultValue: CURRENT_TIMESTAMP
              - column:
                  name: version
                  type: BIGINT
                  defaultValue: 0;
        - createIndex:
            indexName: idx_transactions_account_id
            tableName: transactions
            columns:
              - column:
                  name: account_id
        - createIndex:
            indexName: idx_transactions_created_at
            tableName: transactions
            columns:
              - column:
                  name: created_at