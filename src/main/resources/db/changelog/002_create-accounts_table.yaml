databaseChangeLog:
  - changeSet:
      id: 002_create_accounts_table
      author: bankapp
      changes:
        - createTable:
            tableName: accounts
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: account_number
                  type: VARCHAR(26)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: account_name
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_accounts_users
                    references: users(id)
              - column:
                  name: balance
                  type: NUMERIC(15,2)
                  constraints:
                    nullable: false
                  defaultValue: 0;
              - column:
                  name: currency
                  type: VARCHAR(3)
                  constraints:
                    nullable: false
                  defaultValue: "PLN"
              - column:
                  name: account_type
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
                  defaultValue: "CHECKING"
              - column:
                  name: is_active
                  type: BOOLEAN
                  constraints:
                    nullable: false
                  defaultValue: true;
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
                  defaultValue: CURRENT_TIMESTAMP
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
                  defaultValue: CURRENT_TIMESTAMP
              - column:
                  name: version
                  type: BIGINT
                  defaultValue: 0;
        - createIndex:
            indexName: idx_accounts_user_id
            tableName: accounts
            columns:
              - column:
                  name: user_id
        - createIndex:
            indexName: idx_accounts_account_number
            tableName: accounts
            columns:
              - column:
                  name: account_number